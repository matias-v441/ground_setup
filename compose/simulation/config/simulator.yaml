frames:
  fcu:
    publish_tf: true

uav_names: [
  "uav14",
  "uav16",
]

# the GNSS origin in hw_api.yaml equals the origin of config/worlds/world_bechovice.yaml,
# which lies ~15 m from the east edge of its safety area -> spawn west of it
uav14:
  type: "x500"
  spawn:
    x: -20.0
    y: 0.0
    z: 2.0
    heading: 0.0

uav16:
  type: "x500"
  spawn:
    x: -10.0
    y: 0.0
    z: 2.0
    heading: 0.0

dynamic:
  realtime_factor: 0.3 # [-] 1.0 starves the controllers on a 4-core machine (takeoff fails); raise on stronger hosts

individual_takeoff_platform:
  enabled: false

mrs_uav_flightforge_simulator:

  sensors:

    lidar:

      enabled: true
      horizontal_rays: 128 # [-]
      vertical_rays: 64 # [-]

      lidar_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      lidar_intensity:
        enabled: false
        rate: 10.0 # [Hz]

    rgb:

      enabled: true

      rgb_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      depth:
        enabled: false

    stereo:
      enabled: false
      rate: 30.0

  graphics_settings: "medium"

  realtime_factor: 1.0 # [-]

  # world_name: "valley" # works in Lite
  # world_name: "warehouse" # works in Lite

  # TODO
  # world_name: "cave" # does not work
  # world_name: "dead_spruce_forest" # does not work
  # world_name: "infinite_forest" # does not work
  world_name: "forest" # does not work
  # world_name: "temesvar" # does not work

  # weather_type: "cloudy"

  daytime:

    hour: 15
    minute: 30
