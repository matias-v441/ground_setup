name: remote
root: ./
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
startup_window: status
pre_window: . ./pre.sh
windows:
  - bash:
      layout: tiled
      panes:
        - bash

  - compose:
      layout: tiled
      panes:
        - ../compose/down.sh ; ../compose/up.sh ; lazydocker
  
  - rviz:
      layout: tiled
      panes:
        - ros2 run rviz2 rviz2 -d ../config/rviz/uav14.rviz --ros-args -p use_sim_time:=true

  - status:
      layout: tiled
      panes:
      - ros2 run mrs_uav_status status.sh

  - rerun:
      layout: tiled
      panes:
        - cd ../rerun && . .venv/bin/activate && python3 points.py
        #- cd ../rerun && . .venv/bin/activate && python3 cams.py
  
  - client:
      layout: tiled
      panes:
        - cd ../holoswarm-client && . .venv/bin/activate && holoswarm-client --robots uav14 uav16 --location temesvar
