name: remote
root: ./
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
startup_window: bash
pre_window: . ./pre.sh
windows:
  - bash:
      layout: tiled
      panes:
        - bash

  - compose:
      layout: tiled
      panes:
        - ../compose/down.sh experiment ; ../compose/up.sh experiment ; lazydocker
  
  - rviz:
      layout: tiled
      panes:
        - ros2 run rviz2 rviz2 -d ../config/rviz/uav14_16.rviz --ros-args -p use_sim_time:=true

  # - status:
  #     layout: tiled
  #     panes:
  #       - export UAV_NAME=uav14 ; USE_SIM_TIME=true ; ros2 run mrs_uav_status status.sh
  #       - export UAV_NAME=uav16 ; USE_SIM_TIME=true ; ros2 run mrs_uav_status status.sh
  
  - client:
      layout: tiled
      panes:
        - cd ../holoswarm-client && . .venv/bin/activate && holoswarm-client --workspace temesvar
